<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Kanban App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Todo Kanban Board</h1>
            <p class="text-gray-600 mt-2">Drag and drop tasks between columns</p>
        </header>

        <!-- Add Task Form -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Add New Task</h2>
            <form id="taskForm" class="space-y-4">
                <div>
                    <input type="text" id="taskTitle" placeholder="Task title"
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                           required>
                </div>
                <div>
                    <textarea id="taskDescription" placeholder="Task description (optional)"
                              rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <button type="submit"
                        class="w-full bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition-colors">
                    Add Task
                </button>
            </form>
        </div>

        <!-- Kanban Board -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="kanbanBoard">
            <!-- Todo Column -->
            <div class="space-y-4">
                <div class="flex justify-between items-center pb-2 border-b border-gray-200">
                    <h2 class="text-xl font-semibold text-gray-800">Todo</h2>
                    <span id="todoCount" class="bg-gray-200 text-gray-800 px-3 py-1 rounded-full text-sm">0</span>
                </div>
                <div class="min-h-[200px] border-2 border-dashed border-gray-300 rounded-lg p-4" id="todoColumn"
                     ondrop="dropTask(event)" ondragover="allowDrop(event)"
                     ondragenter="dragEnter(event)" ondragleave="dragLeave(event)">
                    <!-- Tasks will be inserted here -->
                </div>
            </div>

            <!-- In Progress Column -->
            <div class="space-y-4">
                <div class="flex justify-between items-center pb-2 border-b border-gray-200">
                    <h2 class="text-xl font-semibold text-gray-800">In Progress</h2>
                    <span id="inProgressCount" class="bg-gray-200 text-gray-800 px-3 py-1 rounded-full text-sm">0</span>
                </div>
                <div class="min-h-[200px] border-2 border-dashed border-gray-300 rounded-lg p-4" id="inProgressColumn"
                     ondrop="dropTask(event)" ondragover="allowDrop(event)"
                     ondragenter="dragEnter(event)" ondragleave="dragLeave(event)">
                    <!-- Tasks will be inserted here -->
                </div>
            </div>

            <!-- Done Column -->
            <div class="space-y-4">
                <div class="flex justify-between items-center pb-2 border-b border-gray-200">
                    <h2 class="text-xl font-semibold text-gray-800">Done</h2>
                    <span id="doneCount" class="bg-gray-200 text-gray-800 px-3 py-1 rounded-full text-sm">0</span>
                </div>
                <div class="min-h-[200px] border-2 border-dashed border-gray-300 rounded-lg p-4" id="doneColumn"
                     ondrop="dropTask(event)" ondragover="allowDrop(event)"
                     ondragenter="dragEnter(event)" ondragleave="dragLeave(event)">
                    <!-- Tasks will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let draggedTaskId = null;
        let editingTaskId = null;


        // Drag start
        function dragStart(event) {
            // Get the task element (could be clicked on child element)
            const taskElement = event.target.closest('[data-id]');
            if (!taskElement) return;

            draggedTaskId = taskElement.dataset.id;
            event.dataTransfer.setData("text/plain", draggedTaskId);
            taskElement.classList.add("opacity-50");
        }

        // Drag end
        function dragEnd(event) {
            const taskElement = event.target.closest('[data-id]');
            if (taskElement) {
                taskElement.classList.remove("opacity-50");
            }
        }

        // Drag enter - add visual feedback
        function dragEnter(event) {
            // Prevent default to allow drop
            event.preventDefault();
            // Add feedback to the column itself
            const column = event.target.closest('[id$="Column"]');
            if (column) {
                column.classList.add("border-blue-500", "bg-blue-50");
            }
        }

        // Drag leave - remove visual feedback
        function dragLeave(event) {
            // Remove feedback from the column itself
            const column = event.target.closest('[id$="Column"]');
            if (column) {
                column.classList.remove("border-blue-500", "bg-blue-50");
            }
        }

        // Allow dropping
        function allowDrop(event) {
            event.preventDefault();
        }

        // Drop task
        function dropTask(event) {
            event.preventDefault();
            const targetColumn = event.target.closest('[id$="Column"]');
            if (!targetColumn) return;

            // Map column IDs to consistent status values (matching DB expectations)
            const statusMap = {
                'todo': 'todo',
                'inProgress': 'inProgress',
                'done': 'done'
            };
            const status = statusMap[targetColumn.id] || targetColumn.id.replace('Column', '');

            // Update task status via API with just the status field
            fetch(`/api/tasks/${draggedTaskId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ status })
            })
            .then(response => response.json())
            .then(() => {
                loadTasks(); // Reload tasks to reflect changes
            })
            .catch(error => {
                console.error('Error updating task:', error);
                alert('Failed to update task status');
            });
        }

        // Load tasks from API
        function loadTasks() {
            fetch('/api/tasks')
                .then(response => response.json())
                .then(tasks => {
                    // Clear all columns
                    document.getElementById('todoColumn').innerHTML = '';
                    document.getElementById('inProgressColumn').innerHTML = '';
                    document.getElementById('doneColumn').innerHTML = '';

                    // Reset counters
                    document.getElementById('todoCount').textContent = '0';
                    document.getElementById('inProgressCount').textContent = '0';
                    document.getElementById('doneCount').textContent = '0';

                    // Populate columns
                    tasks.forEach(task => {
                        const taskElement = createTaskElement(task);
                        const columnId = `${task.status}Column`;
                        document.getElementById(columnId).appendChild(taskElement);

                        // Update counters
                        const countElement = document.getElementById(`${task.status}Count`);
                        countElement.textContent = parseInt(countElement.textContent) + 1;
                    });
                })
                .catch(error => {
                    console.error('Error loading tasks:', error);
                });
        }

        // Create task element
        function createTaskElement(task) {
            const div = document.createElement('div');
            div.className = 'bg-white rounded-lg shadow p-4 mb-4 cursor-grab';
            div.draggable = true;
            div.dataset.id = task.id;
            div.innerHTML = `
                <h3 class="font-semibold text-gray-900 mb-2">${task.title}</h3>
                <p class="text-gray-600 text-sm mb-3">${task.description || 'No description'}</p>
                <div class="flex justify-between items-center text-xs">
                    <span class="bg-gray-200 px-2 py-1 rounded">${new Date(task.updated_at).toLocaleDateString()}</span>
                    <div class="flex space-x-2">
                        <button onclick="editTask(${task.id})"
                                class="text-2xl text-blue-500 hover:text-blue-700">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteTask(${task.id})"
                                class="text-2xl text-red-500 hover:text-red-700">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;

            div.addEventListener('dragstart', dragStart);
            div.addEventListener('dragend', dragEnd);

            return div;
        }

        // Delete task
        function deleteTask(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;

            fetch(`/api/tasks/${id}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(() => {
                loadTasks();
            })
            .catch(error => {
                console.error('Error deleting task:', error);
                alert('Failed to delete task');
            });
        }

        // Edit task
        function editTask(id) {
            // Prompt for new title and description
            const newTitle = prompt('Enter new title:');
            if (newTitle === null) {
                // User canceled
                return;
            }
            const newDescription = prompt('Enter new description:');
            if (newDescription === null) {
                // User canceled
                return;
            }

            // Update the task via PUT
            fetch(`/api/tasks/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ title: newTitle, description: newDescription })
            })
            .then(response => response.json())
            .then(() => {
                loadTasks();
            })
            .catch(error => {
                console.error('Error editing task:', error);
                alert('Failed to edit task');
            });
        }

        // Handle form submission
        document.getElementById('taskForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const title = document.getElementById('taskTitle').value.trim();
            const description = document.getElementById('taskDescription').value.trim();

            if (!title) return;

            fetch('/api/tasks', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ title, description })
            })
            .then(response => response.json())
            .then(() => {
                // Reset form
                document.getElementById('taskTitle').value = '';
                document.getElementById('taskDescription').value = '';

                // Reload tasks
                loadTasks();
            })
            .catch(error => {
                console.error('Error creating task:', error);
                alert('Failed to create task');
            });
        });

        // Initial load
        loadTasks();
    </script>
</body>
</html>
